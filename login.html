<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b32"><title>Sign in | CAN Grade 12</title>
<style>
:root{--g:#123b32;--gold:#f3bd52;--cream:#fbf8f0;--ink:#172a25;--muted:#64716b;--line:#e5e9e2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.2rem;background:radial-gradient(circle at 90% 10%,#e4ebdc,transparent 35%),var(--cream);font:16px/1.6 system-ui,Arial;color:var(--ink)}.box{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:1.7rem;box-shadow:0 18px 55px #123b3214}.brand{color:var(--g);font-weight:900}.logo{display:inline-grid;place-items:center;background:var(--gold);border-radius:10px;padding:.45rem .65rem;margin-right:.5rem}h1{color:var(--g);line-height:1.15}.muted{color:var(--muted)}label{font-weight:750;font-size:.9rem}input{display:block;width:100%;padding:.85rem;border:1px solid #d9ded7;border-radius:10px;font:inherit;margin:.35rem 0 1rem}button,.btn{display:inline-block;width:100%;padding:.85rem;border:0;border-radius:10px;background:var(--g);color:#fff;font:inherit;font-weight:850;text-align:center;text-decoration:none;cursor:pointer}.status{padding:.8rem;border-radius:10px;background:#f7e8c4;margin:.8rem 0;overflow-wrap:anywhere}.back{display:block;margin-top:1rem;text-align:center;color:var(--g)}.small{font-size:.86rem}
</style></head><body><main class="box"><div class="brand"><span class="logo">CAN</span>CAN GRADE 12</div><h1>Student & teacher sign in</h1><p class="muted">CAN Leadership Academy • 2026–2027</p><p class="small">Accounts must be created by an authorized school administrator. Public self-registration is not enabled.</p>
<form id="loginForm"><label for="email">School email</label><input id="email" type="email" autocomplete="username" required placeholder="you@school.edu"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="8" placeholder="Your password"><button type="submit">Sign in securely</button></form><div id="status" class="status" role="status" hidden></div><a class="back" href="index.html">← Back to public website</a>
<script type="module">
import { supabase } from './supabase-client.js';
const form=document.getElementById('loginForm'), status=document.getElementById('status');
function message(text){status.hidden=false;status.textContent=text;}
const {data:{session}}=await supabase.auth.getSession(); if(session) location.href='portal.html';
form.addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;message('Signing in…');const {error}=await supabase.auth.signInWithPassword({email,password});if(error){message('Sign-in failed. Check your school email and password, or ask the school administrator to help.');return;}location.href='portal.html';});
</script></main></body></html>
