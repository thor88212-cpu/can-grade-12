<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b32"><title>Secure class portal | CAN Grade 12</title>
<style>
:root{--g:#123b32;--gold:#f3bd52;--cream:#fbf8f0;--ink:#172a25;--muted:#64716b;--line:#e5e9e2}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.6 system-ui,Arial}.wrap{width:min(1100px,92%);margin:auto}header{background:var(--g);color:white;padding:1rem 0}header .wrap{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:.7rem 1rem;background:var(--gold);color:var(--g);font-weight:850;cursor:pointer;text-decoration:none}.main{padding:2rem 0}.muted{color:var(--muted)}.notice{background:#f7e8c4;padding:1rem;border-radius:12px;margin:1rem 0}.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin:1.3rem 0}.tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:.7rem .9rem;font:inherit;font-weight:750;cursor:pointer}.tab[aria-selected=true]{background:var(--g);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.2rem;min-height:220px}.item{padding:1rem 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item h3{margin:0;color:var(--g)}.item p{margin:.4rem 0}.empty{color:var(--muted);padding:1rem 0}table{border-collapse:collapse;width:100%;font-size:.93rem}td,th{text-align:left;border-bottom:1px solid var(--line);padding:.65rem .45rem}th{color:var(--g)}@media(max-width:600px){table{font-size:.8rem}td,th{padding:.5rem .25rem}}
</style></head><body><header><div class="wrap"><div><strong>CAN GRADE 12 • Secure portal</strong><div style="font-size:.88rem;color:#d7e5db">CAN Leadership Academy • 2026–2027</div></div><button id="signOut" class="btn">Sign out</button></div></header>
<main class="wrap main"><h1 id="welcome">Your class portal</h1><p class="muted" id="identity">Checking your secure session…</p><div id="status" class="notice" role="status">Loading your account…</div>
<div class="tabs" role="tablist"><button class="tab" data-tab="timetable" aria-selected="true">Timetable</button><button class="tab" data-tab="notes" aria-selected="false">Study notes</button><button class="tab" data-tab="announcements" aria-selected="false">Announcements</button><button class="tab" data-tab="results" aria-selected="false">My exam results</button><button class="tab" data-tab="contacts" aria-selected="false">Teacher contacts</button></div>
<section id="content" class="panel" aria-live="polite"><p class="empty">Loading…</p></section><p class="muted" style="font-size:.85rem">Private records are protected by Supabase authentication and database row-level security. Never share your password.</p><a href="index.html">← Public website</a></main>
<script type="module">
import { supabase } from './supabase-client.js';
const status=document.getElementById('status'), content=document.getElementById('content'), identity=document.getElementById('identity');
let currentUser=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){const {data:{session}}=await supabase.auth.getSession();if(!session){location.href='login.html';return;}currentUser=session.user;const {data:profile,error}=await supabase.from('profiles').select('display_name,role').eq('id',currentUser.id).maybeSingle();if(error||!profile){status.textContent='Your account is signed in, but its class profile has not been set up. Contact the school administrator.';identity.textContent=currentUser.email;content.innerHTML='<p class="empty">Ask the administrator to create your profile and assign the correct role.</p>';return;}identity.textContent=currentUser.email+' • '+profile.role;document.getElementById('welcome').textContent='Welcome, '+(profile.display_name||'CAN student');status.textContent='You are signed in. Only information your account is allowed to access will be shown.';await loadTab('timetable');}
async function loadTab(tab){content.innerHTML='<p class="empty">Loading…</p>';let table,cols,query;
if(tab==='timetable'){table='timetable';query=supabase.from(table).select('day_of_week,start_time,end_time,subject,room,teacher_name').order('day_order').order('start_time');}
if(tab==='notes'){table='study_notes';query=supabase.from(table).select('title,subject,description,resource_url,created_at').order('created_at',{ascending:false});}
if(tab==='announcements'){table='announcements';query=supabase.from(table).select('title,body,published_at').eq('is_published',true).order('published_at',{ascending:false});}
if(tab==='results'){table='exam_results';query=supabase.from(table).select('subject,assessment,score,max_score,term,school_year,student_id,created_at').order('created_at',{ascending:false});}
if(tab==='contacts'){table='teacher_contacts';query=supabase.from(table).select('teacher_name,subject,official_email,office_hours').order('teacher_name');}
const {data,error}=await query;if(error){content.innerHTML='<p class="empty">Could not load this section. The database may still need setup, or your account may not have permission. Ask the administrator for help.</p>';return;}if(!data?.length){content.innerHTML='<p class="empty">Nothing has been posted here yet.</p>';return;}
if(tab==='timetable'){content.innerHTML='<div style="overflow-x:auto"><table><thead><tr><th>Day</th><th>Time</th><th>Subject</th><th>Room</th><th>Teacher</th></tr></thead><tbody>'+data.map(x=>`<tr><td>${esc(x.day_of_week)}</td><td>${esc(x.start_time)}–${esc(x.end_time)}</td><td>${esc(x.subject)}</td><td>${esc(x.room||'—')}</td><td>${esc(x.teacher_name||'—')}</td></tr>`).join('')+'</tbody></table></div>';return;}
if(tab==='results'){content.innerHTML=data.map(x=>`<article class="item"><h3>${esc(x.subject)} — ${esc(x.assessment)}</h3><p>${esc(x.term||'')} ${esc(x.school_year||'')}</p><p><strong>Score: ${esc(x.score)} / ${esc(x.max_score)}</strong></p></article>`).join('');return;}
if(tab==='notes'){content.innerHTML=data.map(x=>`<article class="item"><h3>${esc(x.title)}</h3><p><strong>${esc(x.subject)}</strong></p><p>${esc(x.description||'')}</p>${x.resource_url?`<p><a href="${esc(x.resource_url)}" target="_blank" rel="noopener noreferrer">Open study resource ↗</a></p>`:''}</article>`).join('');return;}
if(tab==='contacts'){content.innerHTML=data.map(x=>`<article class="item"><h3>${esc(x.teacher_name)} — ${esc(x.subject||'Teacher')}</h3><p>${x.official_email?`Official email: <a href="mailto:${esc(x.official_email)}">${esc(x.official_email)}</a>`:''}</p><p>${esc(x.office_hours||'')}</p></article>`).join('');return;}
content.innerHTML=data.map(x=>`<article class="item"><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p><small class="muted">${x.published_at?new Date(x.published_at).toLocaleDateString():''}</small></article>`).join('');}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',async()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));await loadTab(b.dataset.tab);}));
document.getElementById('signOut').addEventListener('click',async()=>{await supabase.auth.signOut();location.href='index.html';});
await init();
</script></body></html>
